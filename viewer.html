<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>サムライ合戦スコアボード - 閲覧用</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter & Noto Sans JP -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- PeerJS -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>

  <style>
    body { font-family: 'Inter', 'Noto Sans JP', sans-serif; }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col antialiased selection:bg-amber-500 selection:text-slate-950">

  <!-- ヘッダー -->
  <header class="bg-slate-900 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md bg-slate-900/90">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
      <div class="flex items-center space-x-3 cursor-pointer" onclick="navigateTo('home')">
        <div class="bg-gradient-to-tr from-amber-600 to-amber-400 p-2 rounded-xl shadow-lg shadow-amber-500/20">
          <i data-lucide="swords" class="w-6 h-6 text-slate-950"></i>
        </div>
        <span class="text-xl font-black tracking-wider text-white">サムライ合戦<span class="text-amber-400">スコアボード</span></span>
      </div>

      <div class="flex items-center gap-3">
        <!-- 閲覧専用バッジ -->
        <span class="px-2.5 py-1 rounded-full text-xs font-bold bg-slate-800 text-slate-400 border border-slate-700 flex items-center gap-1">
          <i data-lucide="eye" class="w-3.5 h-3.5 text-amber-400"></i> 閲覧専用
        </span>

        <!-- リアルタイム同期ステータス -->
        <div class="flex items-center bg-slate-950 border border-slate-800 rounded-xl px-2.5 py-1.5 text-xs whitespace-nowrap">
          <span id="syncStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 mr-1.5 animate-pulse"></span>
          <span id="syncStatusText" class="text-slate-300 font-bold hidden sm:inline">P2P同期中</span>
        </div>

        <button id="btnHome" onclick="navigateTo('home')" class="hidden p-2 hover:bg-slate-800 rounded-xl transition text-slate-400 hover:text-white" title="合戦一覧へ戻る">
          <i data-lucide="home" class="w-5 h-5"></i>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-7xl w-full mx-auto p-4 sm:p-6 lg:p-8">

    <!-- [A] 合戦一覧（閲覧用） -->
    <section id="view-home" class="space-y-8">
      <div class="border-b border-slate-800 pb-6">
        <div class="flex items-center gap-3">
          <h1 class="text-3xl font-black text-white tracking-tight">合戦一覧</h1>
          <div class="flex items-center bg-slate-900 border border-slate-800 rounded-xl px-3 py-1 text-xs">
            <span id="homeSyncStatusDot" class="w-2 h-2 rounded-full bg-emerald-500 mr-2 animate-pulse"></span>
            <span id="homeSyncStatusText" class="text-slate-300 font-bold">P2P同期中</span>
          </div>
        </div>
        <p class="text-slate-400 text-sm mt-1">現在開催中の合戦スコア状況をリアルタイムで閲覧できます。</p>
      </div>

      <div id="gameListContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- [B] 合戦詳細ダッシュボード（閲覧用） -->
    <section id="view-gameDetail" class="space-y-6 hidden">
      <div class="bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col md:flex-row md:items-center justify-between gap-4">
        <div>
          <span class="text-xs font-mono font-bold bg-amber-500/10 text-amber-400 border border-amber-500/20 px-3 py-1 rounded-full inline-block mb-2">リアルタイムスコア中継</span>
          <h1 id="detailGameTitle" class="text-3xl font-black text-white">---</h1>
        </div>
      </div>

      <div id="teamCardsContainer" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

  </main>

  <script>
    const LOCAL_STORAGE_KEY = 'samurai_scoreboard_games_v4';

    let appState = {
      games: [],
      currentGameId: null,
      currentView: 'home'
    };

    let peer = null;
    let peerConnections = [];

    function loadLocalState() {
      try {
        const stored = localStorage.getItem(LOCAL_STORAGE_KEY);
        if (stored) appState.games = JSON.parse(stored);
      } catch (e) {}
    }

    function initP2PSync() {
      const hostId = 'samurai-scoreboard-room-master';
      try {
        peer = new Peer();
        peer.on('open', () => {
          const conn = peer.connect(hostId);
          peerConnections.push(conn);
          conn.on('open', () => {
            updateSyncStatus('リアルタイム同期中', 'emerald');
          });
          conn.on('data', (data) => handleReceivedP2PData(data));
          conn.on('close', () => {
            updateSyncStatus('同期切断', 'amber');
          });
        });
      } catch (e) {}
    }

    function handleReceivedP2PData(data) {
      if (data && data.type === 'SYNC_GAMES' && Array.isArray(data.games)) {
        appState.games = data.games;
        try {
          localStorage.setItem(LOCAL_STORAGE_KEY, JSON.stringify(appState.games));
        } catch(e) {}

        if (appState.currentGameId && !appState.games.some(g => g.id === appState.currentGameId)) {
          appState.currentGameId = null;
          appState.currentView = 'home';
        }
        render();
      }
    }

    function updateSyncStatus(text, color) {
      const dot = document.getElementById('syncStatusDot');
      const txt = document.getElementById('syncStatusText');
      if (txt) txt.innerText = text;
      if (dot) dot.className = `w-2 h-2 rounded-full bg-${color}-500 mr-1.5 animate-pulse`;

      const homeDot = document.getElementById('homeSyncStatusDot');
      const homeTxt = document.getElementById('homeSyncStatusText');
      if (homeTxt) homeTxt.innerText = text;
      if (homeDot) homeDot.className = `w-2 h-2 rounded-full bg-${color}-500 mr-2 animate-pulse`;
    }

    window.onload = function() {
      loadLocalState();
      try { initP2PSync(); } catch (e) {}
      render();
    };

    function getCurrentGame() {
      return appState.games.find(g => g.id === appState.currentGameId);
    }

    function navigateTo(viewName, gameId = null) {
      if (gameId) appState.currentGameId = gameId;
      appState.currentView = viewName;
      render();
    }

    function render() {
      ['home', 'gameDetail'].forEach(v => {
        const el = document.getElementById(`view-${v}`);
        if (el) el.classList.add('hidden');
      });

      const activeEl = document.getElementById(`view-${appState.currentView}`);
      if (activeEl) activeEl.classList.remove('hidden');

      const btnHome = document.getElementById('btnHome');
      if (appState.currentView === 'gameDetail') {
        btnHome.classList.remove('hidden');
      } else {
        btnHome.classList.add('hidden');
      }

      if (appState.currentView === 'home') renderHome();
      if (appState.currentView === 'gameDetail') renderGameDetail();

      if (window.lucide) lucide.createIcons();
    }

    function renderHome() {
      const container = document.getElementById('gameListContainer');
      container.innerHTML = '';

      if (appState.games.length === 0) {
        container.innerHTML = `
          <div class="col-span-full py-12 text-center text-slate-500 bg-slate-900 border border-slate-800 rounded-2xl">
            <i data-lucide="inbox" class="w-12 h-12 mx-auto mb-3 text-slate-600"></i>
            <p>開催中の合戦データがありません。運営者の開始をお待ちください。</p>
          </div>
        `;
        return;
      }

      appState.games.forEach(g => {
        const sortedTeams = [...g.teams].sort((a, b) => b.score - a.score || b.kills - a.kills);
        const topTeam = sortedTeams[0];

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 hover:border-amber-500/50 rounded-2xl p-6 shadow-xl transition cursor-pointer group flex flex-col justify-between space-y-4';
        card.onclick = () => navigateTo('gameDetail', g.id);

        card.innerHTML = `
          <div class="space-y-2">
            <div class="flex items-center justify-between">
              <span class="text-xs font-mono text-slate-400">${g.createdAt}</span>
              <span class="text-xs font-bold bg-slate-800 text-amber-400 px-2.5 py-1 rounded-full flex items-center gap-1">
                <i data-lucide="users" class="w-3 h-3"></i> ${g.teams.length} 軍
              </span>
            </div>
            <h3 class="text-xl font-black text-white group-hover:text-amber-400 transition">${escapeHtml(g.title)}</h3>
          </div>

          <div class="bg-slate-950 p-3 rounded-xl border border-slate-800/80 space-y-1">
            <div class="text-[10px] uppercase font-bold text-slate-500">現在1位 (首位)</div>
            <div class="flex items-center justify-between text-sm font-bold" style="color: ${topTeam ? topTeam.color : '#fff'}">
              <span>👑 ${topTeam ? escapeHtml(topTeam.name) : '-'}</span>
              <span class="font-mono text-white">${topTeam ? topTeam.score : 0} pts (${topTeam ? topTeam.kills : 0} 軍撃破)</span>
            </div>
          </div>

          <div class="flex items-center justify-between pt-2 border-t border-slate-800/50">
            <span class="text-xs font-bold text-amber-400 group-hover:translate-x-1 transition flex items-center gap-1">
              スコアボードを観戦 <i data-lucide="chevron-right" class="w-4 h-4"></i>
            </span>
          </div>
        `;
        container.appendChild(card);
      });
    }

    function renderGameDetail() {
      const game = getCurrentGame();
      if (!game) return;

      document.getElementById('detailGameTitle').innerText = game.title;

      const container = document.getElementById('teamCardsContainer');
      container.innerHTML = '';

      const teams = (Array.isArray(game.teams) ? game.teams : []).filter(Boolean);
      const sortedTeams = [...teams].sort((a, b) => b.score - a.score || b.kills - a.kills);

      const teamRanks = [];
      sortedTeams.forEach((team, idx) => {
        if (idx > 0) {
          const prev = sortedTeams[idx - 1];
          if (team.score === prev.score && team.kills === prev.kills) {
            teamRanks.push(teamRanks[idx - 1]);
          } else {
            teamRanks.push(idx + 1);
          }
        } else {
          teamRanks.push(1);
        }
      });

      sortedTeams.forEach((team, idx) => {
        const rank = teamRanks[idx];
        let rankBadge = `<span class="px-3 py-1 rounded-full text-xs font-black bg-slate-800 text-slate-400 font-mono">${rank}位</span>`;
        if (rank === 1) rankBadge = `<span class="px-3 py-1 rounded-full text-xs font-black bg-gradient-to-r from-amber-400 to-amber-500 text-slate-950 shadow-md">👑 1位</span>`;
        if (rank === 2) rankBadge = `<span class="px-3 py-1 rounded-full text-xs font-black bg-slate-300 text-slate-950">2位</span>`;
        if (rank === 3) rankBadge = `<span class="px-3 py-1 rounded-full text-xs font-black bg-amber-700 text-white">3位</span>`;

        const teamItems = team.items || [];
        const totalItemCount = teamItems.length;

        const itemCounts = {};
        teamItems.forEach(item => {
          itemCounts[item] = (itemCounts[item] || 0) + 1;
        });

        const card = document.createElement('div');
        card.className = 'bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-xl flex flex-col justify-between space-y-5 relative overflow-hidden';
        card.style.borderTop = `4px solid ${team.color}`;

        let itemsHtml = '';
        const itemKeys = Object.keys(itemCounts);
        if (itemKeys.length === 0) {
          itemsHtml = `<p class="text-xs text-slate-500 italic">なし</p>`;
        } else {
          itemsHtml = `<div class="flex flex-wrap gap-2">`;
          itemKeys.forEach(itemName => {
            const count = itemCounts[itemName];
            itemsHtml += `
              <span class="inline-flex items-center gap-1.5 px-3 py-1 bg-slate-950 border border-slate-800 rounded-xl text-xs font-bold text-amber-300">
                <i data-lucide="shield" class="w-3.5 h-3.5 text-amber-400"></i>
                ${escapeHtml(itemName)} ${count > 1 ? `<span class="font-mono text-amber-400">×${count}</span>` : ''}
              </span>
            `;
          });
          itemsHtml += `</div>`;
        }

        card.innerHTML = `
          <div class="space-y-4">
            <div class="flex items-center justify-between">
              <div class="flex items-center gap-2">
                <span class="w-4 h-4 rounded-full inline-block" style="background-color: ${team.color}"></span>
                <h3 class="text-xl font-black text-white">${escapeHtml(team.name)}</h3>
              </div>
              ${rankBadge}
            </div>

            <div class="grid grid-cols-2 gap-3 bg-slate-950 p-4 rounded-xl border border-slate-800/80">
              <div>
                <span class="block text-[10px] uppercase font-bold text-slate-500 mb-0.5">総合得点</span>
                <span class="text-3xl font-black text-white font-mono">${team.score} <span class="text-xs font-normal text-slate-400">pts</span></span>
              </div>
              <div class="border-l border-slate-800 pl-3">
                <span class="block text-[10px] uppercase font-bold text-slate-500 mb-0.5">撃破数</span>
                <span class="text-3xl font-black text-amber-400 font-mono">${team.kills} <span class="text-xs font-normal text-slate-400">軍</span></span>
              </div>
            </div>

            <div class="space-y-2">
              <div class="flex items-center justify-between">
                <span class="text-xs font-bold text-slate-400 uppercase tracking-wider">獲得アイテム一覧</span>
                <span class="text-xs font-bold text-amber-400 font-mono bg-slate-950 px-2 py-0.5 rounded-lg border border-slate-800">合計: ${totalItemCount}個</span>
              </div>
              ${itemsHtml}
            </div>
          </div>
        `;

        container.appendChild(card);
      });
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
    }
  </script>
</body>
</html>
